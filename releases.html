<script>
/* the list of releases in the alphabet chosen by legal.js (it calls window.HadisPage) */
(function () {
  'use strict';
  var T = {
    uz: { title: 'Дастур нашрлари тарихи', intro: 'Дастурнинг барча нашрлари ва улардаги ўзгаришлар.', latest: 'Энг охиргиси', year: 'йил' },
    uz_latn: { title: 'Dastur nashrlari tarixi', intro: 'Dasturning barcha nashrlari va ulardagi oʻzgarishlar.', latest: 'Eng oxirgisi', year: 'yil' }
  };
  var MONTHS = { uz: ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    uz_latn: ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'] };
  var R = window.HadisReleases || [];
  function date(d, l) { var p = d.split('-'); return +p[2] + '-' + MONTHS[l][+p[1] - 1] + ' ' + p[0] + '-' + T[l].year; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  window.HadisPage = function (l) {
    if (!T[l]) l = 'uz';
    document.getElementById('t-intro').textContent = T[l].intro;
    document.getElementById('list').innerHTML = R.map(function (r, i) {
      return '<section class="rel' + (i ? '' : ' latest') + '"><h2><span class="ver">' + esc(r[0]) + '</span>' + esc(r[2][l] || r[2].uz) +
        (i ? '' : ' <span class="tag">' + T[l].latest + '</span>') + '<span class="date">' + date(r[1], l) + '</span></h2>' +
        '<ul>' + (r[3][l] || r[3].uz).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
    }).join('');
  };
})();
</script>
